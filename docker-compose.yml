# SQL Server 2025 (fonte relacional) + MinIO (object storage compatível com S3)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver-2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer@2025!"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "2048"   # limita o SQL Server a 2 GB (cabe em computadores com 8 GB)
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  minio:
    # minio/minio saiu do Docker Hub em set/2026; pgsty/minio é o fork da comunidade (mesmo código, mesmo uso)
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9020:9000"   # API S3 (usada pelo boto3 e pelo Spark)
      - "9021:9001"   # console web
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  sqlserver-data:
  minio-data:
